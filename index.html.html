<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ACA CUSTOM CRAFTS - Synced Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff1a8a;--purple:#8b5cf6;--blue:#0ea5e9;--gold:#f59e0b;--navy:#0f172a;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--green:#10b981;--red:#ef4444;--shadow:0 4px 24px rgba(15,23,42,.06);--shadow2:0 8px 32px rgba(15,23,42,.12);--aca-gradient:linear-gradient(135deg,var(--pink) 0%,var(--purple) 50%,var(--blue) 100%)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:290px;background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);color:#fff;position:fixed;height:100vh;overflow-y:auto;z-index:50}
.brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:12px;align-items:center}.brand-logo{width:48px;height:48px;border-radius:14px;background:var(--aca-gradient);display:grid;place-items:center;font-weight:900;font-size:20px}
.brand h1{font-size:14px;line-height:1.15;font-weight:800}.brand p{font-size:10px;opacity:.7;margin-top:3px;letter-spacing:.08em}
.nav{padding:10px}.nav-section{margin:16px 0 6px 12px;font-size:10px;letter-spacing:.12em;opacity:.5;font-weight:700;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.72);transition:.2s}.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}.nav-item.active{background:var(--aca-gradient);color:#fff}.nav-item.customer-active{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff}
.main{margin-left:290px;flex:1;min-width:0}.topbar{height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:var(--aca-gradient);color:#fff;box-shadow:0 4px 14px rgba(255,26,138,.3)}.btn-primary:hover{transform:translateY(-1px)}.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.card-pad{padding:18px 20px}
.content{padding:22px 24px}.grid{display:grid;gap:16px}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}
.input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;outline:none}
.product-img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;font-size:40px}
.alert{padding:12px 14px;border-radius:12px;font-size:12.5px;font-weight:500;display:flex;gap:10px;line-height:1.5}.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}.alert-success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.sync-badge{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;z-index:999;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="sync-badge"><div class="sync-dot"></div><span id="syncStatus">Syncing orders...</span></div>
<div class="app">
<div class="sidebar">
<div class="brand"><div class="brand-logo">ACA</div><div><h1>ACA CUSTOM CRAFTS</h1><p>SYNCED STORE • V4</p></div></div>
<div class="nav" id="nav"></div>
</div>
<div class="main">
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center">
<button class="btn btn-ghost" onclick="toggleCustomerView()">👁️ <span id="viewBtn">Customer View</span></button>
<span id="orderCountBadge" style="background:var(--pink);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700">0 Orders</span>
</div>
<div style="display:flex;gap:8px">
<button class="btn btn-ghost" onclick="openFirebaseSetup()">⚙️ Setup Sync</button>
<button class="btn btn-primary" onclick="exportOrders()">📤 Export Orders</button>
</div>
</div>
<div class="content" id="content"></div>
</div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// ===== CONFIG - USER MUST EDIT THIS =====
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCfqeMHYtCSmu3wv8BnSTq2TYBH2e3vXeg",
  authDomain: "aca-custom-crafts-b77c6.firebaseapp.com",
  projectId: "aca-custom-crafts-b77c6",
  storageBucket: "aca-custom-crafts-b77c6.firebasestorage.app",
  messagingSenderId: "743474524587",
  appId: "1:743474524587:web:278448bc76109552af62ee",
  measurementId: "G-ELKKDV7VP7"
};

const OWNER_CONFIG = {
  whatsapp: localStorage.getItem('owner_whatsapp') || '639606586826',
  email: localStorage.getItem('owner_email') || 'jhonalbert.francsico01@gmail.com'
};

let db, app;
let isFirebaseEnabled = false;

try{
  // Check if config is filled
  if(firebaseConfig.apiKey.includes('PLACEHOLDER')){
    document.getElementById('syncStatus').innerText = '⚠️ Setup Firebase first - Click Setup Sync';
    isFirebaseEnabled = false;
  } else {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    isFirebaseEnabled = true;
    document.getElementById('syncStatus').innerText = '🟢 Live Sync ON - All devices connected';
    startRealtimeListener();
  }
}catch(e){
  console.log('Firebase not configured yet', e);
  document.getElementById('syncStatus').innerText = '⚠️ Setup needed - Click Setup Sync';
}

window.isFirebaseEnabled = isFirebaseEnabled;
window.db = db;
window.firebaseModules = { collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, getDocs };

// Global state
window.state = {
  currentPage: new URLSearchParams(location.search).has('customer') ? 'customer' : 'dashboard',
  products: JSON.parse(localStorage.getItem('aca_products')||'[]'),
  orders: JSON.parse(localStorage.getItem('aca_orders')||'[]'),
  cart: JSON.parse(localStorage.getItem('aca_cart')||'[]')
};

if(state.products.length===0){
  state.products = [
    {id:'1', name:'Custom Tote Bag', category:'BAGS', price:250, image:'👜', description:'Personalized tote with name', stock:50},
    {id:'2', name:'Keychain Acrylic', category:'KEYCHAIN', price:80, image:'🔑', description:'Custom photo keychain', stock:100},
    {id:'3', name:'Mug Printing', category:'MUGS', price:180, image:'☕', description:'Custom mug with print', stock:30},
  ];
}

function startRealtimeListener(){
  if(!isFirebaseEnabled) return;
  const q = query(collection(db, 'orders'), orderBy('createdAt','desc'));
  onSnapshot(q, (snapshot)=>{
    const firebaseOrders = [];
    snapshot.forEach(doc => {
      firebaseOrders.push({firebaseId: doc.id, ...doc.data()});
    });
    // Merge with local
    state.orders = firebaseOrders;
    localStorage.setItem('aca_orders', JSON.stringify(firebaseOrders));
    render();
    // Notify if new order (if admin view)
    if(firebaseOrders.length>0 && !location.search.includes('customer')){
      const latest = firebaseOrders[0];
      const lastNotified = localStorage.getItem('last_notified_order');
      if(latest.id !== lastNotified){
        localStorage.setItem('last_notified_order', latest.id);
        // Play sound + notify
        if(Notification && Notification.permission==='granted'){
          new Notification('🔔 New Order!', {body: `${latest.customerName} - ₱${latest.total}`});
        }
        // WhatsApp
        if(OWNER_CONFIG.whatsapp){
          const msg = `🔔 NEW ORDER ${latest.id}%0A${latest.customerName}%0A₱${latest.total}%0A${(latest.items||[]).map(i=>i.name+' x'+i.qty).join(', ')}`;
          console.log('New order - WhatsApp would open:', msg);
        }
      }
    }
    document.getElementById('orderCountBadge').innerText = `${firebaseOrders.length} Orders`;
  });
}

window.saveOrderToFirebase = async (order)=>{
  if(!isFirebaseEnabled){
    // Fallback to localStorage + WhatsApp + Email
    state.orders.unshift(order);
    localStorage.setItem('aca_orders', JSON.stringify(state.orders));
    // WhatsApp + Email fallback
    const msg = `NEW ORDER ${order.id} - ${order.customerName} - ₱${order.total}`;
    if(OWNER_CONFIG.whatsapp) window.open(`https://wa.me/${OWNER_CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    if(OWNER_CONFIG.email) fetch(`https://formsubmit.co/ajax/${OWNER_CONFIG.email}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({subject:`New Order ${order.id}`, message:msg})});
    alert('✅ Order placed! (Local mode - Setup Firebase for sync)');
    return;
  }
  try{
    const docRef = await addDoc(collection(db, 'orders'), {...order, createdAt: new Date().toISOString(), status:'new'});
    console.log('Order synced to Firebase:', docRef.id);
    alert('✅ Order synced! Admin notified on all devices 🟢');
  }catch(e){
    console.error('Firebase save error', e);
    alert('Order saved locally but sync failed - check Firebase setup');
  }
}

window.render = function(){
  const content = document.getElementById('content');
  if(state.currentPage==='customer' || location.search.includes('customer')){
    content.innerHTML = `
      <div style="background:var(--aca-gradient);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px">
        <h1 style="font-size:28px;font-weight:800">ACA CUSTOM CRAFTS</h1>
        <p>Customized gifts • Bicol • Nationwide Shipping • GCash Accepted</p>
        <div style="margin-top:12px;display:flex;gap:8px"><span style="background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-size:12px">🟢 Live Store</span><span style="background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-size:12px">📦 ${state.products.length} Products</span></div>
      </div>
      <div class="grid grid-3">
        ${state.products.map(p=>`
          <div class="card" style="cursor:pointer" onclick="addToCart('${p.id}')">
            <div class="product-img">${p.image}</div>
            <div class="card-pad"><b>${p.name}</b><div style="font-size:12px;color:var(--muted)">${p.description}</div><div style="margin-top:8px;font-weight:800;color:var(--pink)">₱${p.price}</div><button class="btn btn-primary" style="margin-top:10px;width:100%">Add to Cart</button></div>
          </div>
        `).join('')}
      </div>
      <div class="card" style="margin-top:20px"><div class="card-pad">
        <h3>🛒 Cart (${state.cart.length})</h3>
        <div id="cartItems" style="margin-top:12px">${state.cart.length===0?'Cart empty': state.cart.map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${c.name} x${c.qty}</span><span>₱${c.price*c.qty} <button onclick="removeCart(${i})" style="color:red;border:0;background:none;cursor:pointer">✕</button></span></div>`).join('')}</div>
        <div style="margin-top:16px;font-weight:800">Total: ₱${state.cart.reduce((s,c)=>s+c.price*c.qty,0)}</div>
        <div style="margin-top:16px;display:grid;gap:8px">
          <input class="input" id="custName" placeholder="Full Name">
          <input class="input" id="custPhone" placeholder="Phone / WhatsApp">
          <input class="input" id="custAddress" placeholder="Complete Address">
          <input class="input" id="gcashRef" placeholder="GCash Reference (optional)">
          <button class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;font-size:15px" onclick="placeOrder()">✅ Place Order - Sync to Admin</button>
        </div>
        <div class="alert alert-info" style="margin-top:12px">🔒 Order will sync instantly to admin dashboard on any device + WhatsApp + Email notification</div>
      </div></div>
    `;
  } else {
    // Admin Dashboard
    content.innerHTML = `
      <h2 style="font-size:22px;font-weight:800;margin-bottom:16px">📊 Admin Dashboard - Live Orders (${state.orders.length})</h2>
      <div class="grid grid-3" style="margin-bottom:20px">
        <div class="card"><div class="card-pad"><div style="font-size:12px;color:var(--muted)">Total Orders</div><div style="font-size:28px;font-weight:800">${state.orders.length}</div><div style="color:var(--green);font-size:12px">🟢 Synced across devices</div></div></div>
        <div class="card"><div class="card-pad"><div style="font-size:12px;color:var(--muted)">Today Revenue</div><div style="font-size:28px;font-weight:800">₱${state.orders.reduce((s,o)=>s+(parseFloat(o.total)||0),0)}</div></div></div>
        <div class="card"><div class="card-pad"><div style="font-size:12px;color:var(--muted)">Sync Status</div><div style="font-size:14px;font-weight:700">${isFirebaseEnabled?'🟢 Firebase Connected':'⚠️ Local Only - Setup Firebase'}</div><button class="btn btn-ghost" style="margin-top:8px" onclick="openFirebaseSetup()">Setup</button></div></div>
      </div>
      <div class="card"><div class="card-pad">
        <h3>🔔 Live Orders - Auto-sync from all customers</h3>
        <div style="margin-top:16px">
          ${state.orders.length===0?'<div class="alert alert-info">No orders yet. Share your customer link: <b>'+location.origin+location.pathname+'?customer</b></div>': state.orders.map(o=>`
            <div style="border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:${o.status==='new'?'#ecfdf5':'#fff'}">
              <div style="display:flex;justify-content:space-between"><b>${o.id} - ${o.customerName}</b><span style="background:${o.status==='new'?'#10b981':'#e2e8f0'};color:${o.status==='new'?'#fff':'#000'};padding:4px 10px;border-radius:999px;font-size:11px">${o.status||'new'}</span></div>
              <div style="font-size:12px;color:var(--muted);margin-top:4px">${o.phone} • ${o.address} • ${new Date(o.createdAt).toLocaleString()}</div>
              <div style="margin-top:8px;font-size:13px">${(o.items||[]).map(i=>`${i.name} x${i.qty}`).join(', ')}</div>
              <div style="margin-top:8px;font-weight:800;color:var(--pink)">₱${o.total} ${o.gcashRef?'• GCash: '+o.gcashRef:''}</div>
              <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-ghost" onclick="markDone('${o.firebaseId||o.id}')">✅ Mark Done</button><button class="btn btn-ghost" onclick="notifyCustomer('${o.phone}','${o.id}')">📱 WhatsApp Customer</button></div>
            </div>
          `).join('')}
        </div>
      </div></div>
      <div class="card" style="margin-top:20px"><div class="card-pad"><h3>🛠️ Products</h3><div class="grid grid-3" style="margin-top:12px">${state.products.map(p=>`<div style="border:1px solid var(--border);padding:12px;border-radius:10px">${p.image} <b>${p.name}</b><br>₱${p.price}</div>`).join('')}</div></div></div>
    `;
  }
  // nav
  document.getElementById('nav').innerHTML = `
    <div class="nav-section">Main</div>
    <div class="nav-item ${state.currentPage==='dashboard'?'active':''}" onclick="state.currentPage='dashboard';render()">📊 Dashboard</div>
    <div class="nav-item ${state.currentPage==='customer'?'customer-active':''}" onclick="state.currentPage='customer';render()">🛍️ Customer Store Preview</div>
    <div class="nav-section">Share</div>
    <div style="padding:10px 12px;font-size:11px;color:rgba(255,255,255,.6);word-break:break-all;background:rgba(255,255,255,.05);border-radius:8px;margin:8px">
      Customer Link:<br><b style="color:#fff">${location.origin+location.pathname}?customer</b><br><button class="btn btn-ghost" style="margin-top:8px;padding:6px 10px;font-size:11px" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'?customer');alert('Copied!')">📋 Copy Link</button>
    </div>
  `;
}

window.addToCart = (id)=>{
  const p = state.products.find(x=>x.id===id);
  const existing = state.cart.find(x=>x.id===id);
  if(existing) existing.qty++; else state.cart.push({...p, qty:1});
  localStorage.setItem('aca_cart', JSON.stringify(state.cart));
  render();
}
window.removeCart = (i)=>{ state.cart.splice(i,1); localStorage.setItem('aca_cart', JSON.stringify(state.cart)); render(); }
window.placeOrder = async ()=>{
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const gcashRef = document.getElementById('gcashRef').value.trim();
  if(!name||!phone||!address) return alert('Please fill name, phone, address');
  if(state.cart.length===0) return alert('Cart empty');
  const order = {
    id: 'ORD-'+Date.now().toString().slice(-6),
    customerName: name,
    phone: phone,
    address: address,
    gcashRef: gcashRef,
    items: [...state.cart],
    total: state.cart.reduce((s,c)=>s+c.price*c.qty,0),
    status: 'new',
    createdAt: new Date().toISOString()
  };
  await saveOrderToFirebase(order);
  state.cart = [];
  localStorage.setItem('aca_cart','[]');
  render();
}
window.markDone = async (fid)=>{
  if(!isFirebaseEnabled){ alert('Local only'); return; }
  try{
    const {doc, updateDoc} = window.firebaseModules;
    await updateDoc(doc(db, 'orders', fid), {status:'done'});
  }catch(e){ console.log(e); }
}
window.notifyCustomer = (phone, id)=>{
  if(!phone) return alert('No phone');
  const cleanPhone = phone.replace(/[^0-9]/g,'');
  const ph = cleanPhone.startsWith('0') ? '63'+cleanPhone.slice(1) : cleanPhone;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(`Hi! Your order ${id} from ACA Custom Crafts is confirmed! We will ship soon. Thank you!`)}`, '_blank');
}
window.toggleCustomerView = ()=>{
  if(location.search.includes('customer')){
    location.href = location.pathname;
  } else {
    location.href = location.pathname+'?customer';
  }
}
window.openFirebaseSetup = ()=>{
  alert(`SETUP FIREBASE FOR CROSS-DEVICE SYNC (5 mins):

1. Go to https://console.firebase.google.com
2. Create project: aca-custom-crafts
3. Click Firestore Database > Create > Start in test mode
4. Project Settings > General > Your apps > Web > Add app > Copy config
5. Paste config in index.html - replace firebaseConfig object

Or I can create it for you if you give me your Gmail.

Without Firebase, orders use WhatsApp + Email only (no cross-device sync).

Current: ${isFirebaseEnabled ? '🟢 Connected' : '⚠️ Not connected - Local only'}
`);
}
window.exportOrders = ()=>{
  const blob = new Blob([JSON.stringify(state.orders,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`ACA-Orders-${new Date().toISOString().slice(0,10)}.json`; a.click();
}

render();
if(Notification && Notification.permission!=='granted') Notification.requestPermission();

</script>
<script>
// Non-module fallback for nav etc - already handled in module
</script>
</body>
</html>
