function calcEngine(){
const prod=state.products.find(p=>p.id===state.calc.productId);if(!prod)return null;
let materialAdjusted=0;(state.calc.materials||[]).forEach(m=>{const mat=state.materials.find(x=>x.id===m.materialId);if(!mat)return;const wast=m.wastage!=null?m.wastage:mat.wastage;const adj=m.qtyUsed*(1+wast/100);materialAdjusted+=adj*mat.costPerUnit;});
let laborCost=0;(state.calc.labor||[]).forEach(l=>laborCost+=l.rate*l.hours);
let machineCost=0,totalWattsHours=0;(state.calc.machines||[]).forEach(u=>{const mc=state.machines.find(x=>x.id===u.machineId);if(!mc)return;machineCost+=u.hours*mc.costPerHour;totalWattsHours+=mc.wattage*u.hours;});
const kwh=totalWattsHours/1000;const elecCost=kwh*state.settings.electricityRate;const f=state.calc.fees;
let designCost=f.design||0,packagingCost=f.packaging||0;let overheadCost=f.overheadType==='fixed'?f.overheadVal:(materialAdjusted+laborCost+machineCost)*f.overheadVal/100;
let subtotal=materialAdjusted+laborCost+machineCost+elecCost+designCost+packagingCost+overheadCost;
let defectCost=subtotal*f.defect/100;subtotal+=defectCost;subtotal+=f.delivery||0;
let paymentFee=0;if(f.paymentMethod==='GCash'){paymentFee=subtotal*state.settings.gcashFee/100+state.settings.gcashFixed;document.getElementById('gcashLive').style.display='inline-flex';}else if(f.paymentMethod==='Maya'){paymentFee=subtotal*state.settings.mayaFee/100;}else{document.getElementById('gcashLive').style.display='none';}
subtotal+=paymentFee+f.commission/100*subtotal+f.tax/100*subtotal;
let rushFee=0;if(f.rushType!=='none'){if(f.rushPct)rushFee+=subtotal*f.rushPct/100;if(f.rushFixed)rushFee+=f.rushFixed;}subtotal+=rushFee;
let totalCost=subtotal,sellingPrice=0;const pr=state.calc.pricing;
if(pr.type==='markup')sellingPrice=totalCost*(1+pr.markup/100);else if(pr.type==='profit')sellingPrice=totalCost+pr.profit;else sellingPrice=pr.margin>=100?totalCost:totalCost/(1-pr.margin/100);
let q=state.calc.qty||1;const tier=state.settings.quantityDiscounts.find(t=>q>=t.min&&q<=t.max);let disc=tier?tier.disc:0;let discountedSP=sellingPrice*(1-disc/100);let rounded=roundPrice(discountedSP);
let profit=rounded-totalCost,markupPct=totalCost?profit/totalCost*100:0,marginPct=rounded?profit/rounded*100:0;
return{materialAdjusted,laborCost,machineCost,elecCost,kwh,designCost,packagingCost,overheadCost,defectCost,deliveryCost:f.delivery||0,paymentFee,rushFee,totalCost,sellingPrice,discountedSP,rounded,profit,markupPct,marginPct,qty:q,totalOrder:rounded*q,totalProfit:profit*q,discountPct:disc,paymentMethod:f.paymentMethod};
}

let html=`<div class="print-area"><h2>${state.settings.businessName} — Quotation</h2><div style="font-size:12px;color:var(--muted)">${state.settings.phone} • ${state.settings.facebook}</div><hr style="margin:12px 0"><table style="width:100%;font-size:12px"><tr style="background:#f8fafc"><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>${state.cart.map(c=>{const p=state.products.find(x=>x.id===c.productId);return `<tr><td style="display:flex;gap:8px;align-items:center"><div style="width:32px;height:32px;border-radius:6px;overflow:hidden;background:#f1f5f9">${p?.imageData?`<img src="${p.imageData}" style="width:100%;height:100%;object-fit:cover">`:`${p?.image||'📦'}`}</div>${p?.name}</td><td>${c.qty}</td><td>${formatMoney(p?.price||80)}</td><td>${formatMoney((p?.price||80)*c.qty)}</td></tr>`}).join('')}</table><div style="margin-top:12px;text-align:right"><b>Total: ${formatMoney(total)}</b><div style="font-size:11px;color:var(--muted)">Valid 7 days • GCash: ${state.settings.gcashNumber}</div></div></div><div style="margin-top:12px"><button class="btn btn-primary" onclick="window.print()">🖨️ Print</button></div>`;
openModal(`<div class="modal-head"><b>Customer Quotation</b><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div><div class="modal-body">${html}</div>`);
}

function renderProducts(){const cats=[...new Set(state.products.map(p=>p.category))];return `<div class="card"><div class="card-pad" style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap"><div style="display:flex;gap:8px"><input class="input" id="prodSearch" placeholder="Search products..." style="width:220px" oninput="filterProd()"><select class="input" id="prodCatFilter" onchange="filterProd()" style="width:160px"><option value="">All Categories</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select><span class="chip">${state.products.filter(p=>p.imageData).length} with photos</span></div><button class="btn btn-primary" onclick="openProductModal()">＋ New Product + Image</button></div></div><div id="prodList" class="grid grid-3" style="margin-top:14px">${listProd(state.products)}</div>`;}
function listProd(list){return list.map(p=>`<div class="card"><div class="card-pad" style="padding:12px"><div class="product-img">${p.imageData?`<img src="${p.imageData}" alt="${p.name}">`:`<span>${p.image||'📦'}</span>`}</div><div style="display:flex;justify-content:space-between;margin-top:10px"><span class="badge badge-blue" style="font-size:9px">${p.category}</span>${p.imageData?'<span class="badge badge-green" style="font-size:9px">📸 Real Photo</span>':'<span class="badge badge-orange" style="font-size:9px">No photo</span>'}</div><div style="font-weight:800;margin-top:8px;font-size:13px">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.description||''}</div><div style="margin-top:8px;font-size:11px">${formatMoney(p.price||80)} • ${p.materials.length} mats</div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="quickCalc('${p.id}')">🧮 Price</button><button class="btn btn-ghost btn-sm" onclick="openProductModal('${p.id}')">Edit + Photo</button><button class="btn btn-ghost btn-sm" onclick="delProd('${p.id}')">Del</button></div></div></div>`).join('');}
function filterProd(){const q=document.getElementById('prodSearch')?.value.toLowerCase()||'';const cat=document.getElementById('prodCatFilter')?.value||'';document.getElementById('prodList').innerHTML=listProd(state.products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cat||p.category===cat)));}
function quickCalc(id){const p=state.products.find(x=>x.id===id);if(!p)return;state.calc.productId=id;state.calc.materials=p.materials.map(m=>({...m}));state.calc.labor=[...(p.labor||[])];state.calc.machines=[...(p.machines||[])];state.calc.fees={design:p.designFee||0,packaging:p.packagingCost||0,overheadType:p.overheadType||'percent',overheadVal:p.overheadVal||5,defect:p.defectRate||3,delivery:0,paymentMethod:'GCash',paymentFee:0,commission:0,tax:0,rushType:'none',rushPct:20,rushFixed:0};state.calc.pricing={type:'markup',markup:state.settings.defaultMarkup,profit:50,margin:state.settings.defaultMargin};state.calc.qty=1;go('calculator');}
function delProd(id){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }if(!confirm('Delete product?'))return;state.products=state.products.filter(p=>p.id!==id);save('products');render();}

function renderCalculator(){const opts=state.products.map(p=>`<option value="${p.id}" ${state.calc.productId===p.id?'selected':''}>${p.name}</option>`).join('');const eng=calcEngine();return `<div class="card"><div class="card-pad"><div class="stepper">${['Product','Materials','Labor/Machines','Fees + GCash','Final'].map((s,i)=>`<div class="step ${state.calc.step===i+1?'active':''} ${state.calc.step>i+1?'done':''}" onclick="setStep(${i+1})">${i+1}. ${s}</div>`).join('')}</div><div class="progress"><div style="width:${state.calc.step/5*100}%"></div></div></div></div><div class="grid grid-2" style="margin-top:16px"><div>${state.calc.step===1?`<div class="card"><div class="card-pad"><h3>STEP 1 — Select Product</h3><div style="margin-top:12px"><select class="input" onchange="onSelectProduct(this.value)"><option value="">— Choose —</option>${opts}</select></div>${state.calc.productId?`<div style="margin-top:12px" class="card"><div class="card-pad" style="display:flex;gap:12px;align-items:center"><div style="width:80px;height:80px;border-radius:10px;overflow:hidden;background:#f1f5f9">${(state.products.find(p=>p.id===state.calc.productId)?.imageData)?`<img src="${state.products.find(p=>p.id===state.calc.productId).imageData}" style="width:100%;height:100%;object-fit:cover">`:`<div style="width:100%;height:100%;display:grid;place-items:center;font-size:32px">${state.products.find(p=>p.id===state.calc.productId)?.image||'📦'}</div>`}</div><div><div style="font-weight:800">${state.products.find(p=>p.id===state.calc.productId)?.name}</div><div style="font-size:11px;color:var(--muted)">${state.products.find(p=>p.id===state.calc.productId)?.description}</div><div style="font-size:11px;margin-top:4px">${formatMoney(state.products.find(p=>p.id===state.calc.productId)?.price||80)} base</div></div></div></div>`:''}<div class="row" style="margin-top:12px"><div><label>Qty</label><input class="input" type="number" min="1" value="${state.calc.qty}" onchange="state.calc.qty=Math.max(1,parseInt(this.value)||1);render()"></div><div><label>Customer</label><input class="input" value="${state.calc.customer}" onchange="state.calc.customer=this.value"></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="setStep(2)">Next →</button></div></div>`:''}${state.calc.step===2?`<div class="card"><div class="card-pad"><h3>STEP 2 — Materials</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Material</th><th>Qty</th><th>Wastage</th><th>Cost</th><th></th></tr></thead><tbody>${(state.calc.materials||[]).map((m,i)=>{const mat=state.materials.find(x=>x.id===m.materialId);return `<tr><td>${mat?mat.name:'?'}</td><td><input class="input" type="number" step="0.01" value="${m.qtyUsed}" onchange="updateCalcMat(${i},'qtyUsed',this.value)"></td><td><input class="input" type="number" value="${m.wastage}" onchange="updateCalcMat(${i},'wastage',this.value)"></td><td>${mat?formatMoney(m.qtyUsed*(1+(m.wastage||0)/100)*mat.costPerUnit):''}</td><td><button class="btn btn-ghost btn-sm" onclick="removeCalcMat(${i})">✕</button></td></tr>`}).join('')}</tbody></table></div><div style="margin-top:12px" class="row"><select class="input" id="addMatSelect"><option value="">＋ Add material...</option>${state.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select><button class="btn btn-primary btn-sm" onclick="addCalcMat()">Add</button></div><div class="row" style="margin-top:16px"><button class="btn btn-ghost" onclick="setStep(1)">← Back</button><button class="btn btn-primary" onclick="setStep(3)">Next →</button></div></div></div>`:''}${state.calc.step===3?`<div class="card"><div class="card-pad"><h3>STEP 3 — Labor & Machines</h3><div class="table-wrap"><table><thead><tr><th>Task</th><th>Rate</th><th>Hrs</th><th>Cost</th><th></th></tr></thead><tbody>${(state.calc.labor||[]).map((l,i)=>`<tr><td><input class="input" value="${l.task}" onchange="updateCalcLabor(${i},'task',this.value)"></td><td><input class="input" type="number" value="${l.rate}" onchange="updateCalcLabor(${i},'rate',this.value)"></td><td><input class="input" type="number" step="0.01" value="${l.hours}" onchange="updateCalcLabor(${i},'hours',this.value)"></td><td>${formatMoney(l.rate*l.hours)}</td><td><button class="btn btn-ghost btn-sm" onclick="removeCalcLabor(${i})">✕</button></td></tr>`).join('')}</tbody></table></div><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addCalcLabor()">＋ Labor</button><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Machine</th><th>Hrs</th><th>Cost</th><th></th></tr></thead><tbody>${(state.calc.machines||[]).map((m,i)=>{const mc=state.machines.find(x=>x.id===m.machineId);return `<tr><td>${mc?mc.name:'?'}</td><td><input class="input" type="number" step="0.01" value="${m.hours}" onchange="updateCalcMachine(${i},'hours',this.value)"></td><td>${mc?formatMoney(m.hours*mc.costPerHour):''}</td><td><button class="btn btn-ghost btn-sm" onclick="removeCalcMachine(${i})">✕</button></td></tr>`}).join('')}</tbody></table></div><div class="row" style="margin-top:8px"><select class="input" id="addMachineSelect"><option value="">＋ Add machine...</option>${state.machines.map(mc=>`<option value="${mc.id}">${mc.name}</option>`).join('')}</select><button class="btn btn-primary btn-sm" onclick="addCalcMachine()">Add</button></div><div class="row" style="margin-top:16px"><button class="btn btn-ghost" onclick="setStep(2)">← Back</button><button class="btn btn-primary" onclick="setStep(4)">Next → Fees + GCash</button></div></div></div>`:''}${state.calc.step===4?`<div class="card"><div class="card-pad"><h3>STEP 4 — Fees + GCash Auto</h3><div class="alert alert-info" style="margin-top:12px">💳 GCash Fee Auto: GCash ${state.settings.gcashFee}% + ₱${state.settings.gcashFixed} | Maya ${state.settings.mayaFee}%</div><div class="form-grid" style="margin-top:12px"><div><label>💳 Payment Method</label><select class="input" onchange="state.calc.fees.paymentMethod=this.value;render()"><option ${state.calc.fees.paymentMethod==='Cash'?'selected':''}>Cash</option><option ${state.calc.fees.paymentMethod==='GCash'?'selected':''}>GCash</option><option ${state.calc.fees.paymentMethod==='Maya'?'selected':''}>Maya</option><option ${state.calc.fees.paymentMethod==='Bank Transfer'?'selected':''}>Bank Transfer</option></select></div><div><label>Design Fee</label><input class="input" type="number" value="${state.calc.fees.design}" onchange="state.calc.fees.design=parseFloat(this.value)||0;render()"></div><div><label>Packaging</label><input class="input" type="number" value="${state.calc.fees.packaging}" onchange="state.calc.fees.packaging=parseFloat(this.value)||0;render()"></div><div><label>Overhead</label><input class="input" type="number" value="${state.calc.fees.overheadVal}" onchange="state.calc.fees.overheadVal=parseFloat(this.value)||0;render()"></div><div><label>Defect %</label><input class="input" type="number" value="${state.calc.fees.defect}" onchange="state.calc.fees.defect=parseFloat(this.value)||0;render()"></div><div><label>Delivery</label><input class="input" type="number" value="${state.calc.fees.delivery}" onchange="state.calc.fees.delivery=parseFloat(this.value)||0;render()"></div><div><label>Markup %</label><input class="input" type="number" value="${state.calc.pricing.markup}" onchange="state.calc.pricing.markup=parseFloat(this.value)||0;render()"></div></div><div class="row" style="margin-top:16px"><button class="btn btn-ghost" onclick="setStep(3)">← Back</button><button class="btn btn-primary" onclick="setStep(5)">Next → Final</button></div></div></div>`:''}${state.calc.step===5?`<div class="card"><div class="card-pad"><h3>STEP 5 — Final Price + GCash</h3>${eng?`<div style="margin-top:16px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Cost Breakdown</div>${[['Material',eng.materialAdjusted,'#3b82f6'],['Labor',eng.laborCost,'#8b5cf6'],['Machine',eng.machineCost,'#ec4899'],['Electricity',eng.elecCost,'#f59e0b'],['Design',eng.designCost,'#10b981'],['Packaging',eng.packagingCost,'#06b6d4'],['Overhead',eng.overheadCost,'#6366f1'],['Defect',eng.defectCost,'#ef4444'],['GCash Fee',eng.paymentFee,'#0077FF'],['Rush',eng.rushFee,'#ff4d8d']].map(([l,v,c])=>v>0.001?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)"><span style="display:flex;gap:8px;align-items:center"><span style="width:8px;height:8px;border-radius:999px;background:${c}"></span>${l}</span><span style="font-family:JetBrains Mono">${formatMoney(v)}</span></div>`:'').join('')}<div style="display:flex;justify-content:space-between;padding:12px 0;font-weight:800;border-top:2px solid var(--navy);margin-top:8px"><span>TOTAL COST</span><span>${formatMoney(eng.totalCost)}</span></div><div style="background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:16px;padding:20px;color:#fff;margin-top:16px"><div style="font-size:11px;opacity:.6;font-weight:700">SELLING PRICE ${eng.paymentMethod!=='Cash'?`+ ${eng.paymentMethod} Fee`:''}</div><div class="price-hero" style="color:#fff;margin-top:6px">${formatMoney(eng.rounded)}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><span class="badge" style="background:rgba(255,255,255,.15);color:#fff">${eng.paymentMethod}</span><span class="badge" style="background:rgba(16,185,129,.2);color:#6ee7b7">Profit ${formatMoney(eng.profit)}</span><span class="badge" style="background:rgba(59,130,246,.2);color:#93c5fd">Margin ${eng.marginPct.toFixed(1)}%</span></div></div><div style="margin-top:16px" class="row"><button class="btn btn-ghost" onclick="setStep(4)">← Back</button><button class="btn btn-primary" onclick="saveCalc()">💾 Save</button><button class="btn btn-ghost" onclick="window.print()">🖨️ Print</button></div></div>`: `<div class="empty">Select product first</div>`}</div></div>`:''}
</div><div>${eng?`<div class="card"><div class="card-pad"><h3 style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Live Preview</h3>${state.products.find(p=>p.id===state.calc.productId)?.imageData?`<div style="margin-top:10px"><img src="${state.products.find(p=>p.id===state.calc.productId).imageData}" style="width:100%;height:120px;object-fit:cover;border-radius:10px"></div>`:''}<div class="price-hero" style="font-size:28px;margin-top:10px">${formatMoney(eng.rounded)}</div><div style="font-size:12px;margin-top:6px">Cost ${formatMoney(eng.totalCost)} • GCash Fee ${formatMoney(eng.paymentFee)} • Profit ${formatMoney(eng.profit)}</div></div></div>`: `<div class="card"><div class="card-pad"><div class="empty">Select product</div></div></div>`}</div></div>`;
}
function setStep(n){state.calc.step=n;render();}
function onSelectProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;state.calc.productId=id;state.calc.materials=p.materials.map(m=>({...m}));state.calc.labor=[...(p.labor||[])];state.calc.machines=[...(p.machines||[])];state.calc.fees={design:p.designFee||0,packaging:p.packagingCost||0,overheadType:p.overheadType||'percent',overheadVal:p.overheadVal||5,defect:p.defectRate||3,delivery:0,paymentMethod:'GCash',paymentFee:0,commission:0,tax:0,rushType:'none',rushPct:20,rushFixed:0};state.calc.pricing={type:'markup',markup:state.settings.defaultMarkup,profit:50,margin:state.settings.defaultMargin};state.calc.qty=1;render();}
function updateCalcMat(i,k,v){state.calc.materials[i][k]=parseFloat(v)||0;render();}function removeCalcMat(i){state.calc.materials.splice(i,1);render();}function addCalcMat(){const sel=document.getElementById('addMatSelect');if(!sel||!sel.value)return;state.calc.materials.push({materialId:sel.value,qtyUsed:1,wastage:3});render();}
function addCalcLabor(){state.calc.labor.push({task:'New',rate:80,hours:0.2});render();}function updateCalcLabor(i,k,v){if(k==='task')state.calc.labor[i][k]=v;else state.calc.labor[i][k]=parseFloat(v)||0;render();}function removeCalcLabor(i){state.calc.labor.splice(i,1);render();}
function addCalcMachine(){const sel=document.getElementById('addMachineSelect');if(!sel||!sel.value)return;state.calc.machines.push({machineId:sel.value,hours:0.1});render();}function updateCalcMachine(i,k,v){state.calc.machines[i][k]=parseFloat(v)||0;render();}function removeCalcMachine(i){state.calc.machines.splice(i,1);render();}
function saveCalc(){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }const eng=calcEngine();if(!eng)return alert('Select product');const prod=state.products.find(p=>p.id===state.calc.productId);const rec={id:uid(),date:new Date().toISOString(),productId:state.calc.productId,productName:prod.name,qty:eng.qty,totalCost:eng.totalCost,sellingPrice:eng.rounded,profit:eng.profit,markup:eng.markupPct,margin:eng.marginPct,customer:state.calc.customer};state.calcs.unshift(rec);save('calcs');toast('Saved ✓');go('history');}
function toast(m){let t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999';document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}

function renderMaterials(){return `<div class="card"><div class="card-pad" style="display:flex;justify-content:space-between"><input class="input" id="matSearch" placeholder="Search..." style="width:240px" oninput="filterMat()"><button class="btn btn-primary btn-sm" onclick="openMaterialModal()">＋ New</button></div></div><div class="card" style="margin-top:12px"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Stock</th><th>Cost</th><th></th></tr></thead><tbody id="matBody">${state.materials.map(m=>`<tr><td>${m.name}</td><td>${m.currentStock}</td><td>${formatMoney(m.costPerUnit)}</td><td><button class="btn btn-ghost btn-sm" onclick="delMat('${m.id}')">Del</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function filterMat(){const q=document.getElementById('matSearch')?.value.toLowerCase()||'';document.getElementById('matBody').innerHTML=state.materials.filter(m=>!q||m.name.toLowerCase().includes(q)).map(m=>`<tr><td>${m.name}</td><td>${m.currentStock}</td><td>${formatMoney(m.costPerUnit)}</td><td></td></tr>`).join('');}function delMat(id){state.materials=state.materials.filter(m=>m.id!==id);save('materials');render();}
function renderMachines(){return `<div class="card"><div class="card-pad"><h3>Machines</h3><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Name</th><th>Cost/Hr</th><th></th></tr></thead><tbody>${state.machines.map(m=>`<tr><td>${m.name}</td><td>${formatMoney(m.costPerHour)}</td><td><button class="btn btn-ghost btn-sm" onclick="delMachine('${m.id}')">Del</button></td></tr>`).join('')}</tbody></table></div></div></div>`;}
function delMachine(id){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }state.machines=state.machines.filter(m=>m.id!==id);save('machines');render();}
function renderOrders(){return `<div class="card"><div class="card-pad"><h3>📋 Customer Orders (${state.orders.length})</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>${new Date(o.date).toLocaleDateString()}</td><td><b>${o.customerName}</b><div style="font-size:11px">${o.contact}</div></td><td>${o.items.map(i=>{const p=state.products.find(x=>x.id===i.productId);return `<div style="display:flex;gap:6px;align-items:center;margin:2px 0"><div style="width:24px;height:24px;border-radius:4px;overflow:hidden;background:#f1f5f9">${p?.imageData?`<img src="${p.imageData}" style="width:100%;height:100%;object-fit:cover">`:`${p?.image||'📦'}`}</div>${p?.name}×${i.qty}</div>`}).join('')}</td><td><b>${formatMoney(o.total)}</b></td><td>${o.paymentMethod}</td><td><select class="input" style="padding:4px" onchange="updateOrderStatus('${o.id}',this.value)"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='paid'?'selected':''}>paid</option><option ${o.status==='completed'?'selected':''}>completed</option></select></td><td><button class="btn btn-ghost btn-sm" onclick="delOrder('${o.id}')">Del</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:20px">No orders yet</td></tr>'}</tbody></table></div></div></div>`;}
function updateOrderStatus(id,s){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }const o=state.orders.find(x=>x.id===id);if(o){o.status=s;save('orders');render();}}function delOrder(id){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }if(!confirm('Delete?'))return;state.orders=state.orders.filter(o=>o.id!==id);save('orders');render();}
function renderQuotations(){return `<div class="card"><div class="card-pad"><h3>Quotations</h3><div class="print-area" style="margin-top:12px">${state.calcs[0]?`<h2>${state.settings.businessName}</h2><div>${state.settings.phone} • ${state.settings.facebook}</div><hr style="margin:12px 0"><div>Product: <b>${state.calcs[0].productName}</b> — ${formatMoney(state.calcs[0].sellingPrice)} ×${state.calcs[0].qty} = <b>${formatMoney(state.calcs[0].sellingPrice*state.calcs[0].qty)}</b></div><div style="margin-top:8px">GCash: ${state.settings.gcashName} ${state.settings.gcashNumber}</div>`:'<div class="empty">No calcs</div>'}</div><button class="btn btn-primary" style="margin-top:12px" onclick="window.print()">🖨️ Print</button></div></div>`;}
function renderHistory(){return `<div class="card"><div class="card-pad"><h3>Price History</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Product</th><th>Cost</th><th>Selling</th><th>Profit</th><th></th></tr></thead><tbody>${state.calcs.map(c=>`<tr><td>${new Date(c.date).toLocaleDateString()}</td><td>${c.productName}</td><td>${formatMoney(c.totalCost)}</td><td>${formatMoney(c.sellingPrice)}</td><td>${formatMoney(c.profit)}</td><td><button class="btn btn-ghost btn-sm" onclick="delCalc('${c.id}')">Del</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center">No history</td></tr>'}</tbody></table></div></div></div>`;}
function delCalc(id){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }state.calcs=state.calcs.filter(c=>c.id!==id);save('calcs');render();}
function renderReports(){return `<div class="grid grid-3"><div class="card"><div class="card-pad"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Profit</div><div style="font-size:22px;font-weight:800;margin-top:6px;color:var(--green)">${formatMoney(state.calcs.reduce((a,c)=>a+c.profit*c.qty,0))}</div></div></div><div class="card"><div class="card-pad"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Orders</div><div style="font-size:22px;font-weight:800;margin-top:6px">${state.orders.length}</div></div></div><div class="card"><div class="card-pad"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Photos</div><div style="font-size:22px;font-weight:800;margin-top:6px">${state.products.filter(p=>p.imageData).length}/${state.products.length}</div></div></div></div>`;}
function renderSettings(){
return `<div class="grid grid-2"><div class="card"><div class="card-pad"><h3 style="font-size:14px;font-weight:800">🎨 Branding & Logo</h3>
<div style="margin-top:12px"><label style="font-size:11px;font-weight:600">Upload Logo (PNG/JPG)</label><input class="input" type="file" accept="image/*" onchange="uploadLogo(event)"><div style="margin-top:10px;display:flex;gap:12px;align-items:center"><div class="brand-logo" style="width:64px;height:64px">${state.settings.logoData?`<img src="${state.settings.logoData}">`:'A'}</div><button class="btn btn-ghost btn-sm" onclick="state.settings.logoData='';saveSettings();render();buildNav()">Remove</button></div></div>
<div class="form-grid" style="margin-top:16px"><div><label style="font-size:11px;font-weight:600">Business Name</label><input class="input" value="${state.settings.businessName}" onchange="state.settings.businessName=this.value;saveSettings()"></div><div><label style="font-size:11px;font-weight:600">Phone</label><input class="input" value="${state.settings.phone}" onchange="state.settings.phone=this.value;saveSettings()"></div><div><label style="font-size:11px;font-weight:600">Facebook</label><input class="input" value="${state.settings.facebook}" onchange="state.settings.facebook=this.value;saveSettings()"></div><div><label style="font-size:11px;font-weight:600">GCash Number</label><input class="input" value="${state.settings.gcashNumber}" onchange="state.settings.gcashNumber=this.value;saveSettings()"></div><div><label style="font-size:11px;font-weight:600">GCash Name</label><input class="input" value="${state.settings.gcashName}" onchange="state.settings.gcashName=this.value;saveSettings()"></div><div><label style="font-size:11px;font-weight:600">GCash Fee %</label><input class="input" type="number" step="0.1" value="${state.settings.gcashFee}" onchange="state.settings.gcashFee=parseFloat(this.value)||0;saveSettings()"></div></div>
</div></div>
<div class="card"><div class="card-pad"><h3 style="font-size:14px;font-weight:800">📸 Product Images — How to use</h3><div style="margin-top:12px;font-size:12px;line-height:1.7">
<b>Now you can add real photos:</b><br/>
1. Go to <b>Product Catalog</b> → <b>Edit</b><br/>
2. Click <b>Upload Product Photo</b><br/>
3. Choose from phone gallery / camera<br/>
4. Image auto-compresses to ~200KB & saves<br/>
5. Shows in Customer Store, Catalog, Cart, Orders<br/><br/>
<div class="alert alert-info">Tip: Use square photos, white background, good lighting. Max 2MB per image — system auto-compresses. Real photos increase sales!</div>
<div style="margin-top:16px"><h3 style="font-size:13px;font-weight:700">Data</h3><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="exportData()">📤 Export JSON</button><button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">📥 Import</button><input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)"><button class="btn btn-ghost btn-sm" onclick="resetDemo()">🔄 Reset Demo</button></div></div>
</div></div></div></div>`;
}
function uploadLogo(e){const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024)return alert('Max 2MB');const r=new FileReader();r.onload=()=>{state.settings.logoData=r.result;saveSettings();render();buildNav();toast('Logo uploaded ✓');};r.readAsDataURL(file);}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('open');}function closeModal(){document.getElementById('modalBg').classList.remove('open');}

function openProductModal(id){
const p=id?state.products.find(x=>x.id===id):null;
state.tempImageData=p?.imageData||'';
openModal(`<div class="modal-head"><b>${p?'Edit':'New'} Product — With Real Photo Upload</b><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div><div class="modal-body">
<div style="margin-bottom:16px"><label style="font-size:12px;font-weight:700">📸 Product Photo — Upload Real Image (NEW)</label>
<div class="image-upload-area" id="imageDrop" onclick="document.getElementById('productImageInput').click()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="this.classList.remove('dragover')">
<div id="imagePreview" style="margin-bottom:10px">${state.tempImageData?`<img src="${state.tempImageData}" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px">`:`<div style="font-size:40px">📸</div><div style="font-size:12px;color:var(--muted);margin-top:6px">Click to upload or drag & drop<br/>PNG, JPG, WEBP — Max 2MB<br/>Auto-compressed to ~200KB</div>`}</div>
<div style="font-size:11px;color:var(--muted)">Replace emoji with real product photo — shows in customer store</div>
</div>
<input type="file" id="productImageInput" accept="image/*" style="display:none" onchange="handleProductImageUpload(event)">
<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('productImageInput').click()">📁 Choose Photo</button><button class="btn btn-ghost btn-sm" onclick="removeProductImage()">🗑️ Remove Photo (use emoji)</button></div>
</div>
<div class="form-grid"><div><label style="font-size:11px;font-weight:600">Product Name *</label><input class="input" id="pm_name" value="${p?.name||''}"></div><div><label style="font-size:11px;font-weight:600">Category</label><input class="input" id="pm_cat" value="${p?.category||'OTHER'}"></div><div><label style="font-size:11px;font-weight:600">Description</label><input class="input" id="pm_desc" value="${p?.description||''}"></div><div><label style="font-size:11px;font-weight:600">Price ₱ (customer view)</label><input class="input" type="number" id="pm_price" value="${p?.price||80}"></div><div><label style="font-size:11px;font-weight:600">Emoji (if no photo)</label><input class="input" id="pm_emoji" value="${p?.image||'📦'}" placeholder="e.g. 🪪"></div></div>
<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-primary" onclick="saveProduct('${p?.id||''}')">💾 Save Product + Photo</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
<div style="margin-top:12px" class="alert alert-info">📸 Photo will show in: Product Catalog, Customer Store, Cart, Orders, Quotations. File is stored in browser (localStorage) — export backup to keep photos.</div>
</div>`);
}
function handleDragOver(e){e.preventDefault();e.currentTarget.classList.add('dragover');}
function handleDrop(e){e.preventDefault();e.currentTarget.classList.remove('dragover');const files=e.dataTransfer.files;if(files.length>0){handleImageFile(files[0]);}}
function handleProductImageUpload(e){const file=e.target.files[0];if(file)handleImageFile(file);}
function handleImageFile(file){
if(!file.type.startsWith('image/'))return alert('Please select an image file');
if(file.size>2*1024*1024)return alert('Image too large — max 2MB. Please compress or choose smaller image.');
const reader=new FileReader();
reader.onload=(ev)=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
let w=img.width,h=img.height;
const maxSize=600;
if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);
const compressed=canvas.toDataURL('image/jpeg',0.7);
state.tempImageData=compressed;
document.getElementById('imagePreview').innerHTML=`<img src="${compressed}" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px"><div style="font-size:11px;color:var(--muted);margin-top:6px">✓ Compressed to ~${Math.round(compressed.length/1024)}KB — ready to save</div>`;
toast('Photo ready — click Save Product');
};
img.src=ev.target.result;
};
reader.readAsDataURL(file);
}
function removeProductImage(){state.tempImageData='';document.getElementById('imagePreview').innerHTML=`<div style="font-size:40px">📦</div><div style="font-size:12px;color:var(--muted);margin-top:6px">No photo — will use emoji</div>`;}

function saveProduct(id){
const name=document.getElementById('pm_name').value.trim();if(!name)return alert('Name required');
const data={id:id||uid(),name,category:document.getElementById('pm_cat').value||'OTHER',description:document.getElementById('pm_desc').value,price:parseFloat(document.getElementById('pm_price').value)||80,image:document.getElementById('pm_emoji').value||'📦',imageData:state.tempImageData||'',unit:'piece',prodTime:10,designTime:5,designFee:0,packagingCost:0,materials:id?state.products.find(x=>x.id===id).materials:[],labor:id?state.products.find(x=>x.id===id).labor:[],machines:[],overheadType:'percent',overheadVal:5,defectRate:2};
if(id){const i=state.products.findIndex(x=>x.id===id);state.products[i]={...state.products[i],...data};}else state.products.push(data);
save('products');closeModal();render();toast('Product + photo saved ✓');
}
function openMaterialModal(){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }openModal(`<div class="modal-head"><b>New Material</b><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div><div class="modal-body"><input class="input" id="mm_name" placeholder="Material name"><input class="input" type="number" id="mm_pq" placeholder="Purchase Qty" style="margin-top:8px" value="100"><input class="input" type="number" id="mm_pp" placeholder="Purchase Price" style="margin-top:8px" value="0"><button class="btn btn-primary" style="margin-top:12px" onclick="saveMaterial()">Save</button></div>`);}
function saveMaterial(){const pq=parseFloat(document.getElementById('mm_pq').value)||1,pp=parseFloat(document.getElementById('mm_pp').value)||0;const data={id:uid(),name:document.getElementById('mm_name').value.trim(),category:'OTHER',unit:'pc',purchaseQty:pq,purchasePrice:pp,costPerUnit:pp/pq,currentStock:0,minStock:10,wastage:3,supplier:''};if(!data.name)return alert('Name required');state.materials.push(data);save('materials');closeModal();render();}
function openBackup(){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }openModal(`<div class="modal-head"><b>Backup — Includes Photos</b><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="alert alert-warn">⚠️ Product photos are stored in backup JSON. File size will be larger (~${Math.round(JSON.stringify(state.products).length/1024)}KB for products with photos). Export regularly!</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" onclick="exportData()">📤 Export JSON with Photos</button><input type="file" id="importFile2" style="display:none" accept=".json" onchange="importData(event)"><button class="btn btn-ghost" onclick="document.getElementById('importFile2').click()">📥 Import</button></div><div style="margin-top:12px;font-size:11px;color:var(--muted)">Products: ${state.products.length} • With photos: ${state.products.filter(p=>p.imageData).length} • Est. backup size: ~${Math.round((JSON.stringify(state).length)/1024)}KB</div></div>`);}
function exportData(){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }const data={materials:state.materials,machines:state.machines,products:state.products,overheads:state.overheads,calcs:state.calcs,settings:state.settings,orders:state.orders,cart:state.cart,exportedAt:new Date().toISOString(),version:'ACA V3 with Images'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ACA-V3-With-Images-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Exported with photos ✓');}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.materials)state.materials=d.materials;if(d.products)state.products=d.products;if(d.orders)state.orders=d.orders;if(d.settings)state.settings={...defaultSettings,...d.settings};save('materials');save('products');save('orders');saveSettings();closeModal();render();buildNav();toast('Imported with photos ✓');}catch{alert('Invalid JSON');}};r.readAsText(file);}
function resetDemo(){ if(IS_CUSTOMER_VIEW){ toast('Admin blocked in customer view'); return; }if(!confirm('Reset demo? Will keep your photos if you already uploaded? Cancel to keep.'))return;localStorage.removeItem(LS.products);seed();render();}

loadAll(); if(IS_CUSTOMER_VIEW){ document.body.classList.add('customer-mode'); state.currentPage='customer'; } buildNav(); render();
</script>
</body>
</html>
